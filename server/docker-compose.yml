name: flashcard

services:
  redis:
    image: "redis:7.4"
    container_name: "redis"
    ports:
      - "6379:6379"

  postgres:
    image: "postgres:17.4"
    container_name: "postgres"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=flashcard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
